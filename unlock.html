<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA PORTAL | Verifikasi Akses</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { cyber: { 400: '#c084fc', 500: '#a855f7', 600: '#9333ea', dark: '#050508', danger: '#ef4444', success: '#22c55e' } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .bg-ambient { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.08) 0%, transparent 60%); z-index: -2; pointer-events: none; }
        .bg-grid { position: fixed; inset: 0; background-size: 30px 30px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px); z-index: -3; mask-image: linear-gradient(to bottom, black 20%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 20%, transparent 100%); }

        .glass-panel { background: rgba(10, 10, 14, 0.5); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.06); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; }
        
        .task-btn { transition: all 0.3s; }
        .task-btn:active { transform: scale(0.98); }
        .task-btn.completed { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.3); color: #22c55e; pointer-events: none; }
        
        .unlock-btn { background: rgba(255, 255, 255, 0.05); color: #64748b; cursor: not-allowed; transition: all 0.4s; }
        .unlock-btn.ready { background: linear-gradient(135deg, #9333ea, #c084fc); color: #ffffff; cursor: pointer; box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4); animation: pulse-glow 2s infinite; }
        .unlock-btn.ready:hover { transform: translateY(-2px); filter: brightness(1.1); }

        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); } 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } }

        /* Toast Notification */
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 100; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .task-btn.locked { opacity: 0.5; filter: grayscale(80%); pointer-events: none; }
        .task-btn.processing { border-color: rgba(234, 179, 8, 0.4); background: rgba(234, 179, 8, 0.05); }
        
        /* Custom Scrollbar for mobile fit */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    </style>
</head>
<body class="flex justify-center items-center p-4 py-8">
    <div class="bg-ambient"></div>
    <div class="bg-grid"></div>

    <!-- Toast Notifikasi Error/Success -->
    <div id="toast" class="glass-panel px-4 py-3 rounded-xl flex items-center gap-3 border-cyber-danger/30 bg-cyber-dark/90">
        <i id="toast-icon" class="fas fa-exclamation-circle text-cyber-danger"></i>
        <p id="toast-msg" class="text-[11px] font-medium text-white"></p>
    </div>

    <div class="w-full max-w-[420px] glass-panel rounded-3xl p-6 relative z-10 flex flex-col items-center shadow-2xl">
        
        <!-- Header -->
        <div class="w-14 h-14 rounded-2xl bg-cyber-500/10 border border-cyber-500/20 text-cyber-400 flex items-center justify-center text-2xl mb-4 shadow-[0_0_30px_rgba(168,85,247,0.15)]">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="text-lg font-extrabold text-white mb-1">Keamanan Tautan</h1>
        <p class="text-[11px] text-slate-400 text-center mb-6 leading-relaxed">Verifikasi bahwa Anda adalah manusia & pendukung kreator dengan menyelesaikan <b class="text-white">4 tugas berurutan</b> di bawah.</p>

        <!-- Task List -->
        <div class="w-full flex flex-col gap-2.5 mb-8" id="task-container">
            
            <!-- Task 1: Subscribe YouTube -->
            <button id="task-sub" onclick="startTask('sub', 15000)" class="task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between group hover:bg-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-red-500/10 text-red-500 flex items-center justify-center text-lg">
                        <i class="fab fa-youtube"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xs font-bold text-white">Subscribe Channel</h3>
                        <p class="text-[9px] text-slate-400">Dukung kreator</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-cyber-500 text-white tracking-wider">MULAI</span>
                </div>
            </button>

            <!-- Task 2: Watch & Like YouTube -->
            <button id="task-watch" onclick="startTask('watch', 35000)" class="task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between group hover:bg-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-pink-500/10 text-pink-400 flex items-center justify-center text-lg">
                        <i class="fas fa-thumbs-up"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xs font-bold text-white">Tonton & Like Video</h3>
                        <p class="text-[9px] text-slate-400">Tonton minimal 35 detik</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-black/50 text-slate-500"><i class="fas fa-lock"></i></span>
                </div>
            </button>

            <!-- Task 3: Join WhatsApp -->
            <button id="task-wa" onclick="startTask('wa', 12000)" class="task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between group hover:bg-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-green-500/10 text-green-400 flex items-center justify-center text-lg">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xs font-bold text-white">Saluran WhatsApp</h3>
                        <p class="text-[9px] text-slate-400">Join untuk info terbaru</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-black/50 text-slate-500"><i class="fas fa-lock"></i></span>
                </div>
            </button>

            <!-- Task 4: Join Telegram -->
            <button id="task-tg" onclick="startTask('tg', 12000)" class="task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between group hover:bg-white/10">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                        <i class="fab fa-telegram-plane"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="text-xs font-bold text-white">Channel Telegram</h3>
                        <p class="text-[9px] text-slate-400">Join komunitas diskusi</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-black/50 text-slate-500"><i class="fas fa-lock"></i></span>
                </div>
            </button>

        </div>

        <!-- Progress Indicator -->
        <div class="w-full flex items-center gap-3 mb-6">
            <div class="h-1.5 flex-1 bg-white/10 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-cyber-500 w-0 transition-all duration-700 ease-out"></div>
            </div>
            <span id="progress-text" class="text-[10px] font-bold text-cyber-400 min-w-[60px] text-right">0/4 Selesai</span>
        </div>

        <!-- Final Unlock Button -->
        <button id="unlock-btn" onclick="getLink()" class="unlock-btn w-full py-4 rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-lg">
            <i class="fas fa-lock"></i> KUNCI MASIH TERTUTUP
        </button>
        
        <div class="mt-5 flex items-center justify-center gap-2 opacity-60">
            <i class="fas fa-satellite-dish text-[10px] text-cyber-400 animate-pulse"></i>
            <p class="text-[8px] text-slate-300 tracking-wider uppercase">Sistem Anti-Bypass Aktif</p>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI DATABASE LINK & VIDEO DINAMIS
        // ==========================================
        // 1. Ambil ID dari link (contoh: unlock.html?id=editor)
        const urlParams = new URLSearchParams(window.location.search);
        const targetId = urlParams.get('id');

        // 2. Setup link default (Global) untuk Channel, WA, dan Telegram
        const defaultLinks = {
            final: "https://bicolink.com/LinkDefaultAnda",
            sub: "https://youtube.com/@ChannelAnda",
            watch: "https://youtube.com/watch?v=VideoDefault", // Video cadangan
            wa: "https://whatsapp.com/channel/0029Vb9egHN1NCrZEt9JKO28",
            tg: "https://t.me/kanaalikesleeping"
        };

        // 3. Database dinamis: Beda ID = Beda Link Bicolink & Beda Video!
        const linkDatabase = {
            'editor': {
                final: 'https://bicolink.com/LinkAsliEditor',
                watch: 'https://youtube.com/watch?v=VideoKhususEditor' // Ganti link video editor
            },
            'effect': {
                final: 'https://bicolink.com/LinkAsliEffect',
                watch: 'https://youtube.com/watch?v=VideoKhususEffect' // Ganti link video effect
            },
            'luts': {
                final: 'https://bicolink.com/LinkAsliLUTs',
                watch: 'https://youtube.com/watch?v=VideoKhususLUTs'   // Ganti link video luts
            },
            'sfx': {
                final: 'https://bicolink.com/LinkAsliSFX',
                watch: 'https://youtube.com/watch?v=VideoKhususSFX'    // Ganti link video sfx
            }
        };

        // 4. Ambil konfigurasi sesuai ID, gabungkan dengan default
        // (Misal WA, TG, dan Sub akan otomatis pakai defaultLinks)
        const currentData = { ...defaultLinks, ...(linkDatabase[targetId] || {}) };
        
        const FINAL_URL = currentData.final; 

        // State Management Urutan & Timer
        const taskSequence = ['sub', 'watch', 'wa', 'tg'];
        let currentTaskIndex = 0;
        
        let tasks = {
            'sub': { done: false, minTime: 15000 },    
            'watch': { done: false, minTime: 35000 }, 
            'wa': { done: false, minTime: 12000 },     
            'tg': { done: false, minTime: 12000 }      
        };
        
        let activeTask = null;
        let clickTime = 0;
        let checkInterval = null;
        let totalTasks = taskSequence.length;

        // Inisialisasi Tampilan Awal Berurutan (Lock/Unlock)
        function initTasksUI() {
            taskSequence.forEach((taskId, index) => {
                let btn = document.getElementById('task-' + taskId);
                let badge = btn.querySelector('.status-badge');
                
                if (tasks[taskId].done) {
                    btn.className = 'task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between completed';
                    badge.innerHTML = '<i class="fas fa-check text-sm"></i>';
                    badge.className = 'status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-green-500/10 text-green-500';
                } else if (index === currentTaskIndex) {
                    // Tugas yang saat ini harus dikerjakan
                    btn.className = 'task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between group hover:bg-white/10 cursor-pointer';
                    badge.innerHTML = 'MULAI';
                    badge.className = 'status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-cyber-500 text-white tracking-wider shadow-[0_0_10px_rgba(168,85,247,0.4)]';
                } else if (index > currentTaskIndex) {
                    // Tugas selanjutnya (Masih terkunci)
                    btn.className = 'task-btn w-full p-3.5 rounded-xl bg-white/5 border border-white/10 flex items-center justify-between locked';
                    badge.innerHTML = '<i class="fas fa-lock"></i>';
                    badge.className = 'status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-black/50 text-slate-500';
                }
            });
        }

        // Panggil saat web pertama dibuka untuk menyusun gembok
        initTasksUI();

        // Fungsi Memulai Tugas & Menjalankan Animasi Timer
        function startTask(taskId, requiredTimeMs) {
            // Tolak jika bukan urutannya atau sedang ada tugas yang berjalan
            if (taskId !== taskSequence[currentTaskIndex]) {
                showToast("Selesaikan tugas sebelumnya terlebih dahulu!", "error");
                return;
            }
            if (activeTask) return;

            let url = currentData[taskId];
            let btn = document.getElementById('task-' + taskId);
            let badge = btn.querySelector('.status-badge');

            activeTask = taskId;
            clickTime = Date.now();
            
            // Ubah UI jadi mode hitung mundur (kuning)
            btn.classList.add('processing');
            
            // Buka link tab baru
            window.open(url, '_blank');

            // Jalankan Timer Animasi langsung di tombol
            checkInterval = setInterval(() => {
                let elapsed = Date.now() - clickTime;
                let timeLeft = Math.ceil((requiredTimeMs - elapsed) / 1000);
                
                if (timeLeft > 0) {
                    // Update tulisan timer (contoh: "8 DETIK")
                    badge.innerHTML = `${timeLeft} DETIK`;
                    badge.className = 'status-badge text-[9px] font-bold px-2.5 py-1.5 rounded bg-yellow-500 text-black tracking-wider shadow-[0_0_10px_rgba(234,179,8,0.3)]';
                } else {
                    // Waktu habis, otomatis sukses!
                    clearInterval(checkInterval);
                    completeTask(taskId);
                }
            }, 500);
        }

        // Fungsi untuk menyelesaikan tugas
        function completeTask(taskId) {
            tasks[taskId].done = true;
            activeTask = null;
            
            showToast("Tugas berhasil! Lanjut ke tahap berikutnya.", "success");
            
            currentTaskIndex++; // Buka gembok tugas selanjutnya
            updateProgress();
            initTasksUI(); // Perbarui tampilan semua tombol
        }

        // HAPUS ATAU TIMPA fungsi document.addEventListener("visibilitychange") YANG LAMA.
        // Kita tidak memakai auto-fail lagi agar user bisa melihat timer berjalan di layar.

        // Update Progress Bar
        function updateProgress() {
            let completed = Object.values(tasks).filter(t => t.done).length;
            
            // Update Bar & Text
            document.getElementById('progress-bar').style.width = (completed / totalTasks * 100) + '%';
            document.getElementById('progress-text').innerText = `${completed}/${totalTasks} Selesai`;

            // Cek jika semua selesai
            if (completed === totalTasks) {
                let unlockBtn = document.getElementById('unlock-btn');
                unlockBtn.classList.add('ready');
                unlockBtn.innerHTML = '<i class="fas fa-unlock text-lg"></i> AMBIL LINK SEKARANG';
                
                // Trigger efek kembang api / sukses bisa ditambah di sini jika mau
            }
        }

        // Action Klik Tombol Final
        function getLink() {
            let completed = Object.values(tasks).filter(t => t.done).length;
            if (completed === totalTasks) {
                // Tampilkan loading sebentar sebelum dialihkan
                let unlockBtn = document.getElementById('unlock-btn');
                unlockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MEMBUKA AKSES...';
                
                setTimeout(() => {
                    window.location.href = FINAL_URL;
                }, 1000);
            } else {
                showToast("Selesaikan semua tugas yang tersisa!", "error");
            }
        }

        // Sistem Pop-Up Notifikasi Bawah (Toast)
        function showToast(msg, type) {
            let toast = document.getElementById('toast');
            let toastIcon = document.getElementById('toast-icon');
            
            document.getElementById('toast-msg').innerText = msg;
            
            if(type === 'error') {
                toast.className = "glass-panel px-4 py-3 rounded-xl flex items-center gap-3 border border-cyber-danger/50 bg-cyber-dark/95 shadow-[0_4px_20px_rgba(239,68,68,0.2)]";
                toastIcon.className = "fas fa-times-circle text-cyber-danger text-lg";
            } else if (type === 'success') {
                toast.className = "glass-panel px-4 py-3 rounded-xl flex items-center gap-3 border border-green-500/50 bg-cyber-dark/95 shadow-[0_4px_20px_rgba(34,197,94,0.2)]";
                toastIcon.className = "fas fa-check-circle text-green-500 text-lg";
            } else {
                toast.className = "glass-panel px-4 py-3 rounded-xl flex items-center gap-3 border border-cyber-400/50 bg-cyber-dark/95 shadow-[0_4px_20px_rgba(168,85,247,0.2)]";
                toastIcon.className = "fas fa-circle-notch fa-spin text-cyber-400 text-lg";
            }

            toast.classList.add('show');
            
            // Auto hide
            setTimeout(() => { 
                toast.classList.remove('show'); 
            }, 3500);
        }
    </script>
</body>
</html>
